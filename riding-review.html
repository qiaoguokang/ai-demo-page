<!doctype html><meta charset="utf-8"><title>骑乘动画 · 完整循环检查</title><style>body{margin:0;background:#193d43;color:#e6ecd8;font:16px system-ui}header{padding:16px;display:flex;gap:20px;align-items:center}button,select{padding:8px;font:inherit}canvas{display:block;width:min(100%,1200px);margin:auto}a{color:#d4e5b9}</style><header>骑乘组合动画 · 三个成长阶段 <select id="speed"><option value="1">正常速度</option><option value="0.25">¼慢速</option></select><button id="pause">暂停</button><button id="step">逐帧</button><a href="./">返回游戏</a></header><canvas width="1200" height="720"></canvas><script src="riding.js"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),images={};let time=0,last=0,paused=false,manual=null;const sequence=[0,1,2,3,4,5,2,3,4,5,6,7,0];
Promise.all([0,1,2].map(age=>new Promise(resolve=>{const im=new Image;im.onload=()=>{images['v5-ride-'+age]=im;resolve()};im.src='assets/v5/ride-'+age+'.png'}))).then(()=>requestAnimationFrame(frame));
document.querySelector('#pause').onclick=()=>{paused=!paused;manual=null};document.querySelector('#step').onclick=()=>{paused=true;manual=((manual??sequence[Math.floor(time*3)%sequence.length])+1)%8;draw()};
function draw(){ctx.fillStyle='#a9cbc2';ctx.fillRect(0,0,1200,720);for(let age=0;age<3;age++){const i=manual??sequence[Math.floor(time*3)%sequence.length],x=200+age*400;ctx.fillStyle='#244a43';ctx.font='20px system-ui';ctx.fillText(['幼年','少年','成年'][age]+' · 姿态 '+i,x-120,75);ctx.strokeStyle='#6a998d';ctx.beginPath();ctx.moveTo(x-170,530);ctx.lineTo(x+170,530);ctx.stroke();ridingFrame(age,i,x,530,310)}ctx.font='16px system-ui';ctx.fillText('完整循环：坐稳 → 蹬地 → 上拍 → 下拍 → 回收 → 滑翔 → 落地。每幅为一张组合绘制，不叠加独立角色。',40,670)}
function frame(t){time+=paused?0:Math.min(.1,(t-last)/1000||0)*Number(document.querySelector('#speed').value);last=t;draw();requestAnimationFrame(frame)}
</script>
