<!doctype html><meta charset="utf-8"><title>小黑龙 · 动画验收</title>
<style>body{margin:0;background:#193d43;color:#eef5e6;font:16px system-ui}header{padding:18px 24px;display:flex;gap:20px;align-items:center}button,select{font:inherit;padding:8px;background:#d3e6cc;border:0;border-radius:4px;color:#234a45}canvas{display:block;max-width:100%;margin:auto}span{opacity:.8}</style>
<header><strong>小黑龙 · 逐帧动画检查</strong><select id="speed"><option value="1">正常速度</option><option value="0.25">¼ 慢速</option></select><button id="pause">暂停</button><button id="step">前进一帧</button><span>三种成长阶段：行走 / 跳跃 / 振翅。地线用于检查接地。</span></header>
<canvas id="review" width="1200" height="840"></canvas><script src="motion.js"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),images={},game={mode:'play'},terrain=()=>0;let elapsed=0,paused=false,last=0;
Promise.all(Array.from({length:3},(_,age)=>['ground','air'].map(kind=>new Promise(resolve=>{const im=new Image;im.onload=()=>{images['dragon-'+kind+'-'+age]=im;resolve()};im.src='assets/dragon-animation/'+kind+'-'+age+'.png'}))).flat()).then(()=>requestAnimationFrame(frame));
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'继续':'暂停'};document.querySelector('#step').onclick=()=>{paused=true;elapsed+=1/9;draw()};
function draw(){ctx.fillStyle='#b8d9d0';ctx.fillRect(0,0,1200,840);ctx.font='16px system-ui';for(let age=0;age<3;age++){const y=age*280+235,w=175;for(let c=0;c<3;c++){const x=200+c*400;ctx.strokeStyle='#729f92';ctx.beginPath();ctx.moveTo(x-175,y);ctx.lineTo(x+175,y);ctx.stroke();ctx.fillStyle='#28564e';ctx.fillText(['幼年','少年','成年'][age]+' · '+['步态循环','起跳 / 收腿 / 落地','上抬 / 下拍 / 回收'][c],x-175,y-210);let kind='ground',i=0,yy=y;if(c===0){i=Math.floor(elapsed*78/(w*.56)*8)%8;for(let n=0;n<12;n++){let xx=x-170+((n*30-elapsed*78)%360+360)%360;ctx.fillRect(xx,y+8,5,2)}}else if(c===1){const t=elapsed%3.4;if(t<.3)i=8;else if(t<.5)i=9;else if(t<2.8){const p=(t-.5)/2.3;i=p<.12?10:p<.32?11:p<.66?12:13;yy-=Math.sin(p*Math.PI)*70}else i=t<2.95?14:15;}else{kind='air';i=4+Math.floor(elapsed*9)%8;}dragonFrame(age,kind,i,x,yy,w);ctx.fillText(kind+' '+i,x-175,y+30)}}}
function frame(t){elapsed+=paused?0:Math.min(.1,(t-last)/1000||0)*Number(document.querySelector('#speed').value);last=t;draw();requestAnimationFrame(frame)}
</script>
